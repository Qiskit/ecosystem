name: Ecosystem | New member

on:
  pull_request:
    types:
      - closed

jobs:
  if_new_member:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    steps:
    - id: get-id
      run: |
        project_name=$(echo "${{github.event.pull_request.body}}" | grep "Nomination for" | cut -d: -f2- | awk '{$1=$1};1')
        echo "project_name=$project_name" >> $GITHUB_OUTPUT

        nominator=$(echo "${{github.event.pull_request.body}}" | grep ", via" | cut -d@ -f2- | cut -d, -f1 | awk '{$1=$1};1')
        echo "nominator=@$nominator" >> $GITHUB_OUTPUT

        uuid=$(echo "${{github.head_ref}}" | cut -d - -f2 | awk '{$1=$1};1')
        echo "uuid=$uuid" >> $GITHUB_OUTPUT

    # The badge has to exist in main as soon as the submission is accepted. Otherwise, every
    # website deploy until then logs "badge not found for <member>" and the project page and
    # qisk.it/ecosystem-badges show no badge.
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.base.ref }}  # the PR is merged already, so checkout main
        token: ${{ secrets.REPO_SCOPED_TOKEN }}
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Install taplo
      uses: uncenter/setup-taplo@v2
      with:
        version: "0.10.0"
    - name: Create badge
      env:
        BITLY_TOKEN: ${{ secrets.BITLY_TOKEN }}
      run: python manager.py members update_badge ${{ steps.get-id.outputs.uuid }}
    - name: Run taplo formater on TOML files
      run: taplo fmt resources/members/*.toml
    - name: Commit badge
      run: |
        git config --local user.email "qiskit-bot@users.noreply.github.com"
        git config --local user.name "qiskit-bot"
        if git diff --exit-code; then
          echo "No badge to commit"
        else
          git commit -am "Badge for ${{ steps.get-id.outputs.project_name }}"
          git pull --rebase
          git push --verbose
        fi

    - name: Create comment on success
      uses: peter-evans/create-or-update-comment@v5
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
              Hello ${{ steps.get-id.outputs.nominator }},

              **${{ steps.get-id.outputs.project_name }} is now part of the Qiskit Ecosystem**. Here are some follow up actions you can take to get the most out of the program:

              - :speech_balloon: Join other Qiskit ecosystem developers in the Slack [channel `#qiskit-ecosystem`](https://qiskit.slack.com/archives/C04RHE56N93). If you are not in the Qiskit workspace yet, sign up at https://qisk.it/join-slack
              - :books: Use the [Qiskit Sphinx theme](https://github.com/Qiskit/qiskit_sphinx_theme) for your documentation
              - :purple_heart: Add the [Qiskit Ecosystem badge](https://qiskit.github.io/ecosystem/p/${{ steps.get-id.outputs.uuid }}/#badge) to the project's `README.md`
              - :ballot_box_with_check: Keep an eye on the [criteria compliance](https://qisk.it/ecosystem-checkups) to keep the project membership status. The [maintainer's guide to the check ups](https://qiskit.github.io/ecosystem/overview/#for-project-maintainers) explains how they work, how much time there is to address one, and what to do if one does not apply to this project.
              - :telephone_receiver: If you have questions or feedback, [join the Qiskit Community Call](http://evt.to/eooiimagw), [hosted by the Unitary Foundation](https://unitary.foundation/community/events/), or just open an issue on this repo.

              It is great to have this project in the Qiskit Ecosystem. Thanks for nominating it `:)`.
